# Logic Spellbook – Application Workflow (v2)
#
# A model preserves selected facts so that a property becomes answerable.
#
# Engineering question:
#
#   Can a user create, edit, validate, run, explain, save, reopen,
#   and delete spell pages without running an invalid circuit,
#   silently discarding unsaved edits, or silently deleting a saved page?
#
# This model represents the entire application's user workflow,
# not the behavior of one particular spell.
#
# Changes from v1:
#
#   - The library now holds MULTIPLE saved pages, abstracted as
#     library_has_pages (at least one) and library_has_many (at least two).
#   - saved_copy is replaced by page_saved: whether the page currently
#     open in the editor has a stored snapshot.
#   - Deletion is modeled: delete requires an explicit confirmation state.
#   - Library actions added: duplicate-page, rename-page.
#   - There is no autosave. Unsaved work is only resolved by an explicit
#     save or an explicit discard.
#
# A page contains:
#
#   Left page: miniature scene (placeholder art for now), inputs, outputs.
#   Right page: rune palette, placed runes, and glowing connections.
#
# States represent interface modes. Variables preserve the facts
# needed to decide which actions are allowed.
#
# Validation and simulation are represented through explicit
# result events. This model does not compute graph validity or
# Boolean outputs itself. Trace playback (step-by-step gate animation)
# is internal to the tracing state and is not modeled per step.
#
# Machine rationale lives on the application entity, following
# the supplied template's annotation workaround.

mage: 1

system:
  id: logic-spellbook-application
  name: Logic Spellbook
  description: >
    A browser application presented as an illustrated spellbook,
    hosted entirely on GitHub Pages. Users manage a library of spell
    pages, place Boolean-logic runes, connect them with glowing ink,
    validate their circuits, interact with miniature scenes, inspect
    step-by-step evaluation traces, and save, reopen, duplicate,
    rename, or delete their pages. Persistence is browser-only
    (IndexedDB) with file export and import.

entities:

  application:
    type: application
    label: Logic Spellbook
    notes:
      - id: application-model-rationale
        kind: rationale
        text: >
          The application-workflow machine represents the major
          interface modes and the conditions governing movement
          between them. It preserves unsaved-change status,
          validation status, whether the open page has a stored
          snapshot, whether the library holds one or several pages,
          and runtime-result availability. It deliberately abstracts
          away exact page contents, circuit topology, Boolean
          calculations, and persistent-storage implementation.

      - id: validation-boundary
        kind: rationale
        text: >
          Validation success and failure are modeled as explicit
          outcomes from a separate validator. Success is required
          before entering preview. This model verifies that the
          interface respects the validator's result; it does not
          verify that the validator classifies circuits correctly.
          Which circuit shapes are valid (for example, whether
          feedback cycles are allowed through memory runes) is a
          validator concern and may grow without changing this model.

      - id: snapshot-boundary
        kind: rationale
        text: >
          Each saved page has one stored snapshot; there is no
          autosave and no draft history. Loading restores the snapshot
          and requires revalidation. Page identity is abstracted:
          the model tracks only whether the library has no pages,
          at least one, or at least two, and whether the open page
          has been saved. Exact counts are omitted, so effects that
          change the count are modeled conservatively.

      - id: deletion-boundary
        kind: rationale
        text: >
          Deleting a saved page is destructive and cannot be undone.
          It is reachable only from the library through an explicit
          confirmation state. Deletion applies to library pages, never
          to the page currently open in the editor.

  library:
    type: interface-region
    label: Spell Page Library
    notes:
      - id: library-purpose
        kind: rationale
        text: >
          The entry screen listing saved pages. Supports creating a
          page, opening, duplicating, renaming, and deleting a saved
          page. Thumbnails are a later enhancement.

  spell-page:
    type: document
    label: Spell Page
    notes:
      - id: page-purpose
        kind: rationale
        text: >
          Combines a miniature scene with an editable logic circuit.
          Changes to its contents make the page dirty and invalidate
          previous validation.

  scene:
    type: interface-region
    label: Miniature Scene
    notes:
      - id: scene-purpose
        kind: rationale
        text: >
          Displays interactive inputs and animated output objects,
          using placeholder visuals until art exists. In preview,
          inputs can change without changing circuit topology.

  rune-editor:
    type: interface-region
    label: Rune Editor
    notes:
      - id: editor-purpose
        kind: rationale
        text: >
          Supports placing, moving, selecting, and deleting runes,
          and creating or removing glowing connections. Rune and
          ink rendering is SVG with GSAP animation.

  rune-palette:
    type: interface-region
    label: Rune Palette
    notes:
      - id: palette-purpose
        kind: rationale
        text: >
          Offers input runes, Either/OR, Both/AND, Opposite/NOT,
          and output runes. AND and OR accept any number of inputs;
          one output may feed multiple destinations. More complex
          runes (such as memory runes) are planned later.

  validator:
    type: application-component
    label: Circuit Validator
    notes:
      - id: validator-purpose
        kind: rationale
        text: >
          Reports whether the current circuit can be evaluated.
          Intended checks include required connections, compatible
          endpoints, and unsupported feedback cycles. The set of
          allowed cycle forms is configurable. The workflow model
          receives its result as an event.

  simulator:
    type: application-component
    label: Spell Simulator
    notes:
      - id: simulator-purpose
        kind: rationale
        text: >
          Evaluates a validated circuit by propagating values in
          rounds until nothing changes, so future memory runes and
          feedback do not require a redesign. Each round is one unit
          of the step-by-step trace. Exact evaluation is outside
          this workflow model.

  trace-inspector:
    type: interface-region
    label: Trace Inspector
    notes:
      - id: trace-purpose
        kind: rationale
        text: >
          Explains an available evaluation result by animating one
          propagation round at a time, highlighting the runes and
          connections that changed in that round.

  page-storage:
    type: application-component
    label: Page Storage
    notes:
      - id: storage-purpose
        kind: rationale
        text: >
          Saves, loads, duplicates, renames, and deletes page
          snapshots in IndexedDB, and exports or imports page files.
          Saving may succeed or fail; dirty status is cleared only
          after success.

machines:

  application-workflow:
    label: Application Workflow
    entity: application
    description: >
      Models the user-facing lifecycle of spell pages and the
      guards preventing invalid execution, accidental loss of
      unsaved edits, and accidental deletion of saved pages.

    purpose:
      question: >
        Can spell pages move through creation, editing, validation,
        preview, explanation, saving, reopening, and deletion while
        respecting validation, unsaved-work, and deletion boundaries?

      represents:
        - page creation
        - page reopening
        - page duplication and renaming
        - confirmed page deletion
        - editor interactions
        - connection editing
        - unsaved-change status
        - validation success and failure
        - simulation-result availability
        - scene input interaction
        - trace inspection
        - saving success and failure
        - explicit discard of unsaved work
        - return to the page library

      omits:
        - exact circuit graph and connection identities
        - exact rune positions
        - Boolean gate evaluation
        - validator implementation
        - animation frames and timing
        - trace contents and individual trace steps
        - storage format and IndexedDB operations
        - export and import of page files
        - exact number of saved pages
        - multiple simultaneous open pages
        - autosave and draft history
        - undo and redo history
        - puzzle scoring and progression
        - application crashes and recovery

    initial: library

    states:

      library:
        label: Page Library
        description: >
          Shows the new-page action and the list of saved pages,
          with open, duplicate, rename, and delete actions.

      confirming-delete:
        label: Confirm Page Deletion
        description: >
          Asks the user to confirm permanent deletion of a selected
          saved page, or cancel.

      editing:
        label: Editing Page
        description: >
          Shows the scene, rune palette, editable circuit,
          inspector, and save/validate controls.

      validating:
        label: Validating Spell
        description: >
          Circuit editing is paused while validation is pending.

      invalid:
        label: Validation Errors
        description: >
          Shows errors and offers a return to editing.
          Preview is unavailable.

      preview:
        label: Interactive Preview
        description: >
          Runs a validated spell. Inputs are interactive.
          Circuit topology is not editable in this mode.

      tracing:
        label: Trace Inspector
        description: >
          Plays and displays a step-by-step explanation of an
          available evaluation result. Input changes are paused
          during inspection.

      saving:
        label: Saving Page
        description: >
          Editing is paused while persistence is pending.

      save-error:
        label: Save Failed
        description: >
          Reports persistence failure. Unsaved changes remain.

    variables:

      dirty:
        type: integer
        range: [0, 1]
        initial: 0
        description: >
          Whether the open page has unsaved changes.
          Cleared by successful saving or explicit discard.

      validated:
        type: integer
        range: [0, 1]
        initial: 0
        description: >
          Whether the current circuit has passed validation.
          Cleared whenever page contents are edited.

      page_saved:
        type: integer
        range: [0, 1]
        initial: 0
        description: >
          Whether the page open in the editor has a stored snapshot.
          This is not necessarily the latest edited version.

      library_has_pages:
        type: integer
        range: [0, 1]
        initial: 0
        description: Whether the library holds at least one saved page.

      library_has_many:
        type: integer
        range: [0, 1]
        initial: 0
        description: >
          Whether the library holds at least two saved pages.
          Implies library_has_pages.

      runtime_ready:
        type: integer
        range: [0, 1]
        initial: 0
        description: >
          Whether an evaluation result is available to display
          or explain.

      preview_active:
        type: integer
        range: [0, 1]
        initial: 0
        description: Whether interactive preview is active.

      trace_active:
        type: integer
        range: [0, 1]
        initial: 0
        description: Whether trace inspection is active.

      library_visible:
        type: integer
        range: [0, 1]
        initial: 1
        description: Whether the page library is visible.

    transitions:

      # ---------------------------------------------------------
      # Page lifecycle
      # ---------------------------------------------------------

      - from: library
        to: editing
        label: create-new-page
        effects:
          dirty: 1
          validated: 0
          page_saved: 0
          runtime_ready: 0
          preview_active: 0
          trace_active: 0
          library_visible: 0

      - from: library
        to: editing
        label: open-saved-page
        requires:
          library_has_pages: {gt: 0}
        effects:
          dirty: 0
          validated: 0
          page_saved: 1
          runtime_ready: 0
          preview_active: 0
          trace_active: 0
          library_visible: 0

      # Ordinary navigation must not abandon unsaved edits.
      - from: editing
        to: library
        label: return-to-library
        requires:
          dirty: {lt: 1}
        effects:
          validated: 0
          runtime_ready: 0
          library_visible: 1

      # Separate, explicitly confirmed discard action.
      - from: editing
        to: library
        label: confirm-discard-and-return
        requires:
          dirty: {gt: 0}
        effects:
          dirty: 0
          validated: 0
          runtime_ready: 0
          library_visible: 1

      # ---------------------------------------------------------
      # Library page management
      # ---------------------------------------------------------

      # Duplicating always yields at least two saved pages.
      - from: library
        to: library
        label: duplicate-page
        requires:
          library_has_pages: {gt: 0}
        effects:
          library_has_many: 1

      - from: library
        to: library
        label: rename-page
        requires:
          library_has_pages: {gt: 0}

      # Deletion is only reachable through the confirmation state.
      - from: library
        to: confirming-delete
        label: request-delete-page
        requires:
          library_has_pages: {gt: 0}

      - from: confirming-delete
        to: library
        label: cancel-delete

      # Deleting the only saved page empties the library.
      - from: confirming-delete
        to: library
        label: confirm-delete-only-page
        requires:
          library_has_many: {lt: 1}
        effects:
          library_has_pages: 0

      # With several pages, the exact remaining count is abstracted,
      # so both outcomes (still many, or exactly one) are allowed.
      - from: confirming-delete
        to: library
        label: confirm-delete-leaves-many
        requires:
          library_has_many: {gt: 0}

      - from: confirming-delete
        to: library
        label: confirm-delete-leaves-one
        requires:
          library_has_many: {gt: 0}
        effects:
          library_has_many: 0

      # ---------------------------------------------------------
      # Non-mutating editor interaction
      # ---------------------------------------------------------

      - from: editing
        to: editing
        label: select-rune-or-connection

      - from: editing
        to: editing
        label: inspect-selected-item

      # ---------------------------------------------------------
      # Page-content changes
      #
      # Every content edit invalidates the previous validation.
      # This deliberately treats even layout edits conservatively.
      # ---------------------------------------------------------

      - from: editing
        to: editing
        label: place-rune
        effects:
          dirty: 1
          validated: 0
          runtime_ready: 0

      - from: editing
        to: editing
        label: move-rune
        effects:
          dirty: 1
          validated: 0
          runtime_ready: 0

      - from: editing
        to: editing
        label: delete-rune
        effects:
          dirty: 1
          validated: 0
          runtime_ready: 0

      - from: editing
        to: editing
        label: connect-ink-path
        effects:
          dirty: 1
          validated: 0
          runtime_ready: 0

      - from: editing
        to: editing
        label: delete-ink-path
        effects:
          dirty: 1
          validated: 0
          runtime_ready: 0

      - from: editing
        to: editing
        label: edit-scene-or-page-settings
        effects:
          dirty: 1
          validated: 0
          runtime_ready: 0

      # ---------------------------------------------------------
      # Validation
      # ---------------------------------------------------------

      - from: editing
        to: validating
        label: request-validation
        effects:
          validated: 0
          runtime_ready: 0

      - from: validating
        to: editing
        label: validation-succeeded
        effects:
          validated: 1

      - from: validating
        to: invalid
        label: validation-failed
        effects:
          validated: 0
          runtime_ready: 0

      - from: invalid
        to: editing
        label: return-to-fix-errors

      # ---------------------------------------------------------
      # Preview and evaluation
      # ---------------------------------------------------------

      - from: editing
        to: preview
        label: run-spell
        requires:
          validated: {gt: 0}
        effects:
          preview_active: 1
          runtime_ready: 0

      - from: preview
        to: preview
        label: evaluation-result-ready
        effects:
          runtime_ready: 1

      - from: preview
        to: preview
        label: toggle-scene-input
        effects:
          runtime_ready: 0

      - from: preview
        to: editing
        label: stop-preview
        effects:
          preview_active: 0
          runtime_ready: 0

      # ---------------------------------------------------------
      # Explain the current evaluation
      # ---------------------------------------------------------

      - from: preview
        to: tracing
        label: explain-spell
        requires:
          runtime_ready: {gt: 0}
        effects:
          preview_active: 0
          trace_active: 1

      - from: tracing
        to: tracing
        label: inspect-explanation

      - from: tracing
        to: preview
        label: close-explanation
        effects:
          trace_active: 0
          preview_active: 1

      # ---------------------------------------------------------
      # Save workflow
      # ---------------------------------------------------------

      - from: editing
        to: saving
        label: save-page

      # Re-saving a page that already has a snapshot.
      - from: saving
        to: editing
        label: save-succeeded-existing-page
        requires:
          page_saved: {gt: 0}
        effects:
          dirty: 0

      # First save of a new page into an empty library.
      - from: saving
        to: editing
        label: save-succeeded-first-page
        requires:
          page_saved: {lt: 1}
          library_has_pages: {lt: 1}
        effects:
          page_saved: 1
          library_has_pages: 1
          dirty: 0

      # First save of a new page into a library that already has pages.
      - from: saving
        to: editing
        label: save-succeeded-additional-page
        requires:
          page_saved: {lt: 1}
          library_has_pages: {gt: 0}
        effects:
          page_saved: 1
          library_has_many: 1
          dirty: 0

      - from: saving
        to: save-error
        label: save-failed

      - from: save-error
        to: saving
        label: retry-save

      - from: save-error
        to: editing
        label: return-to-editor-after-save-error

# -------------------------------------------------------------------
# Behavioral questions
#
# These queries address interface reachability and safety boundaries.
# They do not establish circuit-evaluator or persistence correctness.
# -------------------------------------------------------------------

queries:

  preview-is-reachable:
    name: A user can reach interactive preview
    kind: behavior
    quantifier: exists
    behavior:
      form: reach
      target:
        application-workflow.preview_active: 1

  trace-is-reachable:
    name: A user can inspect an evaluation trace
    kind: behavior
    quantifier: exists
    behavior:
      form: reach
      target:
        application-workflow.trace_active: 1

  page-can-be-saved:
    name: A saved page snapshot can exist
    kind: behavior
    quantifier: exists
    behavior:
      form: reach
      target:
        application-workflow.page_saved: 1

  saved-page-can-remain-in-library:
    name: A saved page can be available from the library
    kind: behavior
    quantifier: exists
    behavior:
      form: reach
      target:
        application-workflow.library_has_pages: 1
        application-workflow.library_visible: 1

  multiple-pages-can-exist:
    name: The library can hold several saved pages
    kind: behavior
    quantifier: exists
    behavior:
      form: reach
      target:
        application-workflow.library_has_many: 1
        application-workflow.library_visible: 1

  library-can-be-emptied:
    name: A library with saved pages can become empty again
    kind: behavior
    quantifier: exists
    behavior:
      form: reach
      target:
        application-workflow.library_has_pages: 0
        application-workflow.page_saved: 1

  unvalidated-preview-is-reachable:
    name: Preview can run without successful validation
    kind: behavior
    quantifier: exists
    behavior:
      form: reach
      target:
        application-workflow.preview_active: 1
        application-workflow.validated: 0

  trace-without-result-is-reachable:
    name: Trace inspection can open without an evaluation result
    kind: behavior
    quantifier: exists
    behavior:
      form: reach
      target:
        application-workflow.trace_active: 1
        application-workflow.runtime_ready: 0

  dirty-library-is-reachable:
    name: Unsaved work can remain while the library is shown
    kind: behavior
    quantifier: exists
    behavior:
      form: reach
      target:
        application-workflow.library_visible: 1
        application-workflow.dirty: 1

requirements:

  validation-before-preview:
    statement: >
      Interactive preview must not be active unless the current
      circuit has passed validation.
    expressed_as: unvalidated-preview-is-reachable
    satisfied_when: refuted

  result-before-explanation:
    statement: >
      Trace inspection must not be active without an available
      evaluation result.
    expressed_as: trace-without-result-is-reachable
    satisfied_when: refuted

  explicit-unsaved-work-resolution:
    statement: >
      The application must not return to the library with
      unresolved unsaved edits. The user must save successfully
      or explicitly discard those edits.
    expressed_as: dirty-library-is-reachable
    satisfied_when: refuted

  # Note: "deletion requires confirmation" is enforced structurally.
  # The only transitions that clear library_has_pages or leave the
  # confirming-delete state originate from confirming-delete, and the
  # only way into that state is request-delete-page. A reachability
  # query cannot express "never without passing through a state", so
  # this property is documented here rather than as a requirement.
